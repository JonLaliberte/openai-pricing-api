name: Update OpenAI Pricing

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 12 * * *'  # Run daily at 12:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Create github_pages directory
        run: mkdir -p github_pages

      - name: Fetch OpenAI pricing
        run: |
          python scripts/fetch_openai_pricing.py
      
      - name: List generated files
        run: |
          echo "=== Generated files ==="
          ls -lah github_pages/
          echo ""
          echo "=== pricing.json preview ==="
          head -n 30 github_pages/pricing.json || echo "No pricing.json"
          echo ""
          echo "=== api.json preview ==="
          head -n 30 github_pages/api.json || echo "No api.json"

      - name: Commit generated pricing files
        run: |
          git add github_pages/pricing.json github_pages/api.json github_pages/history.json

          if git diff --cached --quiet; then
            echo "No pricing changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update generated pricing data"
          git push
